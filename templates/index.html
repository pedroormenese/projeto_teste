{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'CSS/style.css'%}">
    <link rel="stylesheet" href="{% static 'bootstrap/dist/css/bootstrap.min.css'%}">
</head>
<body>

    
    <h1 class="display-3 h3 text-center">Sua Lista de Coisas</h1>
    <p class="lead text-center">Uma lista simples usando JavaScript e um pouquinho de Bootstrap</p>

    <div class="d-flex flex-column align-items-center w-100 gap-4 mt-5">
        <form class="d-flex flex-column align-items-center w-100 gap-2">
            <input class="w-50" type="text" id="form-value" placeholder="Escreva algo e envie">
            <div class="d-flex justify-content-center gap-2 w-100">
                <input class="w-25" type="submit" id="submit"></input>
                <button class="btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
                    <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
                    </svg>
                </button>
            </div>
        </form>
        <hr class="w-50">
        <ul class="w-50 gap-5" id="lista"></ul>
        
    </div>

    <div class="lista">

        <div class="item-container">
            <div class="acoes">
                <button>Excluir</button>
            </div>

            <div class="item">
                Livro A
            </div>
        </div>

        <div class="item-container">
            <div class="acoes">
                <button>Excluir</button>
            </div>

            <div class="item">
                Livro B
            </div>
        </div>

    </div>
    
    <script src="{% static 'JS/script.JS'%}"></script>
    <script src="{% static 'bootstrap/dist/js/bootstrap.bundle.js'%}"></script>
</body>
</html>
